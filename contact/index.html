<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Oleg Aba</title>
  <meta name="description" content="Get in touch with Oleg Aba — support and general inquiries.">
  <link rel="icon" href="/favicon/favicon.ico">
  <style>
    html {
      background: #fff;
      color-scheme: light;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 2.5rem 1.25rem 4rem;
      background: #fff;
      color: #595959;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      font-size: 26px;
      color: #000;
      margin: 0 0 .5rem;
    }

    a {
      color: #3030F1;
      word-break: break-word;
    }

    .intro {
      margin: 0 0 2rem;
    }

    label {
      display: block;
      margin: 0 0 .375rem;
      color: #000;
    }

    .field {
      margin: 0 0 1.25rem;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: .625rem .75rem;
      border: 1px solid #d1d1d1;
      border-radius: 4px;
      background: #fff;
      color: #000;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #3030F1;
      box-shadow: 0 0 0 2px rgba(48, 48, 241, .15);
    }

    textarea {
      min-height: 9rem;
      resize: vertical;
    }

    button {
      padding: .625rem 1.5rem;
      border: 0;
      border-radius: 4px;
      background: #3030F1;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      opacity: .85;
    }

    button[disabled] {
      opacity: .5;
      cursor: default;
    }

    .status {
      margin: 1rem 0 0;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: #c02626;
    }

    .footnote {
      margin: 2.5rem 0 0;
      padding-top: 1.25rem;
      border-top: 1px solid #e5e5e5;
    }

    .hp {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Contact</h1>
    <p class="intro">
      Questions, app support, or anything else — send a message below and I'll get back to you.
      You can also email me directly at <a href="mailto:contact@olegaba.com">contact@olegaba.com</a>.
    </p>

    <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="e88b6e22-1d46-417b-8561-fa6407784578">
      <input type="hidden" name="subject" value="New message from olegaba.com/contact">
      <input type="hidden" name="from_name" value="olegaba.com">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <button type="submit" id="submit-button">Send message</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="footnote"><a href="/">← Back to olegaba.com</a></p>
  </div>

  <script>
    (function () {
      var form = document.getElementById('contact-form');
      var button = document.getElementById('submit-button');
      var status = document.getElementById('status');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        button.disabled = true;
        button.textContent = 'Sending…';
        status.className = 'status';

        var payload = {};
        new FormData(form).forEach(function (value, key) { payload[key] = value; });

        fetch(form.action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (!result.ok || !result.data.success) {
              throw new Error(result.data && result.data.message);
            }
            form.innerHTML =
              '<p>Thanks — your message is on its way. I\'ll reply to the address you gave.</p>';
          })
          .catch(function () {
            button.disabled = false;
            button.textContent = 'Send message';
            status.className = 'status show error';
            status.innerHTML =
              'Something went wrong sending that. Please email ' +
              '<a href="mailto:contact@olegaba.com">contact@olegaba.com</a> instead.';
          });
      });
    })();
  </script>
</body>

</html>
