<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Oleg Aba</title>
  <meta name="description" content="Get in touch with Oleg Aba — support and general inquiries.">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <style>
    :root {
      --body: #7b7b80;
      --title: #1b1b1d;
      --background: #fafafd;
      --secondary-background: #f3f3f6;
      --background-active: #e5e5ea;
      --accent: #007aff;
      --secondary-accent: #c0d9f5;
      --on-accent: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --body: #8D8D8D;
        --title: #F0F2F3;
        --background: #141414;
        --secondary-background: #171717;
        --background-active: #1b1b1b;
        --accent: #0a84ff;
        --secondary-accent: #152a44;
        --on-accent: #ffffff;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: light dark;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      padding: 80px 24px;
      background: var(--background);
      color: var(--body);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background 0.2s linear;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      color: var(--title);
      font-size: 40px;
      text-align: center;
      letter-spacing: 8px;
      text-transform: uppercase;
    }

    p {
      font-size: 16px;
      line-height: 30px;
      font-weight: 300;
    }

    a {
      color: var(--accent);
      word-break: break-word;
    }

    .intro {
      margin: 24px 0 40px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--title);
      font-size: 14px;
      font-weight: 400;
    }

    .field {
      margin-bottom: 24px;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--background-active);
      border-radius: 2px;
      background: var(--secondary-background);
      color: var(--title);
      font-family: inherit;
      font-size: 16px;
      font-weight: 300;
      line-height: 24px;
      transition: border-color 0.2s linear, box-shadow 0.2s linear;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--secondary-accent);
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px 24px;
      border: 0;
      border-radius: 2px;
      background: var(--accent);
      color: var(--on-accent);
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s linear;
    }

    button:hover {
      opacity: 0.85;
    }

    button[disabled] {
      opacity: 0.5;
      cursor: default;
    }

    .status {
      display: none;
      margin-top: 16px;
      font-size: 14px;
      line-height: 24px;
      text-align: center;
    }

    .status.show {
      display: block;
    }

    .sent {
      text-align: center;
    }

    .hp {
      display: none !important;
    }

    @media (max-width: 960px) {
      body {
        padding: 48px 24px;
      }

      h1 {
        font-size: 25px;
        letter-spacing: 5px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Contact</h1>
    <p class="intro">
      Questions, app support, or anything else — send a message below and I'll get back to you.
      You can also email me directly at <a href="mailto:contact@olegaba.com">contact@olegaba.com</a>.
    </p>

    <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="e88b6e22-1d46-417b-8561-fa6407784578">
      <input type="hidden" name="subject" value="New message from olegaba.com/contact">
      <input type="hidden" name="from_name" value="olegaba.com">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <button type="submit" id="submit-button">Send message</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </div>

  <script>
    (function () {
      var form = document.getElementById('contact-form');
      var button = document.getElementById('submit-button');
      var status = document.getElementById('status');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        button.disabled = true;
        button.textContent = 'Sending…';
        status.className = 'status';

        var payload = {};
        new FormData(form).forEach(function (value, key) { payload[key] = value; });

        fetch(form.action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (!result.ok || !result.data.success) {
              throw new Error(result.data && result.data.message);
            }
            form.innerHTML =
              '<p class="sent">Thanks — your message is on its way. ' +
              'I\'ll reply to the address you gave.</p>';
          })
          .catch(function () {
            button.disabled = false;
            button.textContent = 'Send message';
            status.className = 'status show';
            status.innerHTML =
              'Something went wrong sending that. Please email ' +
              '<a href="mailto:contact@olegaba.com">contact@olegaba.com</a> instead.';
          });
      });
    })();
  </script>
</body>

</html>
